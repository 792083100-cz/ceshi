<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 - 即将上线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 56px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    .emoji { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; letter-spacing: 1px; }
    p { font-size: 16px; line-height: 1.8; opacity: 0.92; }
    .hint { margin-top: 28px; font-size: 13px; opacity: 0.7; }
    .bar {
      margin: 32px auto 0;
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: #fff;
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎨</div>
    <h1>作品集正在准备中</h1>
    <p>Portfolio Coming Soon</p>
    <div class="bar"></div>
    <p class="hint">内容即将上线，敬请期待</p>
  </div>
</body>
</html>
