    function recoveryHTML(turn){return `<div class="recovery-reply"><p>助手暂时无法响应，请稍后重试。</p><span>原问题已保留。</span><div><button data-action="retry">${icon('rotate-ccw')}稍后重试</button></div></div>`;}

    function errorHTML(turn){if(turn.status==='network')return `<div class="network-feedback" role="status"><div class="network-feedback-title">${icon('circle-alert')}<strong>网络连接出现问题</strong></div><p>请检查网络连接，然后重试。</p><button class="network-retry" data-action="retry">${icon('rotate-ccw')}重试</button></div>`;return `<div class="error-inline"><p class="error-message">${icon('stop')}<span>已停止生成，问题已保留</span></p></div>`;}

    function turnHTML(turn,index){const failed=turn.status==='cancelled';return `<section class="turn ${failed?'is-failure':''}" data-turn="${index}" data-turn-id="${escapeHTML(turn.id||String(index))}"><div class="user-message">${failed?`<button class="message-retry" data-action="retry" aria-label="重新生成" title="重新生成">${icon('rotate-ccw')}</button>`:''}<div class="user-bubble">${escapeHTML(turn.question)}${turn.attachments?.length?`<div class="sent-attachments">${turn.attachments.map(a=>attachmentHTML(a,true)).join('')}</div>`:''}</div></div><div class="turn-response" id="response-${index}">${turn.status==='loading'?`<div class="generation-feedback">${analysisStatusHTML(turn)}<button data-action="stop-generation">停止生成</button></div>`:turn.status==='success'?reportHTML(turn,index):turn.status==='partial'?partialHTML(turn):turn.status==='busy'?recoveryHTML(turn):turn.status==='insufficient'?insufficientHTML(turn):turn.status==='note'?noteReplyHTML(turn):errorHTML(turn)}</div></section>`;}
    function parseNote(question){
      const match=question.match(/(\d+(?:\.\d{1,2})?)\s*(?:元|块|人民币)/);if(!match)return null;
      const cents=Math.round(Number(match[1])*100);if(!Number.isSafeInteger(cents)||cents<=0||cents>99999999)return null;
      const name=question.replace(match[0],'').replace(/帮我|记一笔账|记一笔|记账|今天|昨天|花了|花费|支出|[，。,:：]/g,'').trim()||'日常支出';
      const category=/餐|饭|咖啡|早餐|面包/.test(name)?'餐饮美食':/车|交通|地铁/.test(name)?'交通出行':/购物|超市|百货/.test(name)?'购物消费':/药|医疗|挂号/.test(name)?'医疗健康':'其他支出';
      return {name:name.slice(0,40),cents,category,date:/昨天/.test(question)?'2026-10-30':'2026-10-31'};
    }
    function noteReplyHTML(turn){const n=turn.noteDraft;return `<div class="note-reply">${n?`<p>${turn.noteSaved?'已经记好了，可在资产页的“我的记账”中查看。':turn.noteError?'这笔账尚未保存，信息已为你保留。':'这笔支出整理好了，请确认：'}</p><div class="note-confirm"><strong>${escapeHTML(n.name)}<b>¥${money(n.cents)}</b></strong><span>${n.date} · ${n.category}</span></div>${turn.noteSaved?'':`${turn.noteError?`<p class="note-save-error">${escapeHTML(turn.noteError)}</p>`:''}<button class="primary-button" data-action="confirm-note" ${turn.noteSaving?'disabled':''}>${turn.noteSaving?'正在保存…':turn.noteError?'重新保存':'确认记账'}</button>`}<small>仅保存在本机，不计入内置模拟账单。</small>`:'<p>可以，告诉我这笔钱的用途和金额吧。</p><p class="note-example">例如：“今天午餐花了 28 元”。</p>'}</div>`;}
    function persistNote(turn){
      if(!turn?.noteDraft||turn.noteSaved||turn.noteSaving)return;

        const next=state.notes.some(n=>n.id===turn.noteId)?state.notes:[...state.notes,{...turn.noteDraft,id:turn.noteId}].slice(-100);

      if(replace&&state.turns.length)state.turns[state.turns.length-1]=turn;else state.turns.push(turn);

      state.timers.push(setTimeout(()=>updateStage(1),500));
      state.timers.push(setTimeout(()=>updateStage(2),1050));
      state.timers.push(setTimeout(()=>{

    function sourceHTML(){return `<span class="source-badge">${icon('database')}内置模拟数据 · 非真实账户</span><p>每个金额都能回到原始明细。这个原型使用本地样例账单，不连接银行账户或在线 AI 服务。</p><dl class="source-facts"><div><dt>数据来源</dt><dd>支付宝、银行卡（模拟）</dd></div><div><dt>账单范围</dt><dd>2026.09.01 — 10.31</dd></div><div><dt>明细数量</dt><dd>${BILLS.length} 笔已完成支出</dd></div><div><dt>10 月合计</dt><dd>¥${money(sum(monthBills('2026-10')))} · 34 笔</dd></div><div><dt>9 月合计</dt><dd>¥${money(sum(monthBills('2026-09')))} · 34 笔</dd></div><div><dt>更新时间</dt><dd>${SNAPSHOT.updated}</dd></div></dl><h3>统计口径</h3><p>按交易日期统计已完成的支出；不含收入、退款和账户间转账。金额以人民币展示，按整数分计算后汇总。</p><h3>环比规则</h3><p>环比 =（10 月支出 − 9 月支出）÷ 9 月支出。</p><div class="sheet-callout">支持 9 月、10 月、近 7 天、今天、昨天，以及分类查询。超出范围或不支持的问题会提示数据不足，不会编造结果。</div><button class="primary-button" data-action="all-bills">${icon('receipt')}查看模拟账单</button>`;}

    function openSheet(type,context=null){
      if(sheetLayer.hidden)focusBeforeSheet=document.activeElement;state.sheet=type;state.sheetContext=context;if(type==='details'){state.ledgerCategory='全部';state.ledgerTab='details';}sheetLayer.classList.remove('is-side','is-tour');
      const titles={recharge:'会员充值',membership:'会员权益',source:'数据说明',details:'账单明细',menu:'更多操作',voice:'语音输入',analysis:'分析记录',attach:'添加图片或文件',preview:'附件预览',share:'分享回答',income:'本月收支',yield:'收益说明',note:'记一笔',bill:'账单详情',settings:'更多设置'},title=titles[type]||'添加账单';
      const body=type==='recharge'?rechargeHTML():type==='membership'?membershipHTML():type==='source'?sourceHTML():type==='details'?ledgerHTML():type==='menu'?menuHTML():type==='voice'?voiceHTML():type==='analysis'?analysisRecordHTML(context):type==='preview'?attachmentPreviewHTML(context):type==='share'?shareHTML(context):type==='income'?assetIncomeHTML():type==='yield'?`<span class="source-badge">${icon('chart')}演示收益</span><h3>本周收益 ¥${money(ASSET_DEMO.weeklyYield)}</h3><p>此数值仅用于资产页原型展示，未接入真实资产账户，也不代表实际投资收益。</p>`:type==='note'?noteFormHTML():type==='bill'?assetBillHTML(context.bill,context.note):type==='settings'?`<button class="secondary-button" data-action="toggle-amounts">${icon(state.assetHideAmounts?'eye':'eye-off')}${state.assetHideAmounts?'显示金额':'隐藏金额'}</button><div class="sheet-callout">隐私设置仅影响本次页面中的资产金额显示。</div>`:attachHTML();
      sheetLayer.innerHTML=`<section class="sheet ${type}-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><span class="sheet-handle" aria-hidden="true"></span><header class="sheet-header"><h2 id="sheet-title">${title}</h2><button class="icon-button" data-action="close-sheet" aria-label="关闭${title}">${icon('x')}</button></header><div class="sheet-body">${body}</div></section>`;
      sheetLayer.hidden=false;setProductInert(true);sheetLayer.querySelector('[data-action="close-sheet"]').focus({preventScroll:true});
    }
    function setProductInert(value){document.querySelector('.app-nav').inert=value;scrollEl.inert=value;document.querySelector('.composer-area').inert=value;}
    function closeSheet(restoreFocus=true){sheetLayer.hidden=true;sheetLayer.classList.remove('is-side','is-tour');sheetLayer.innerHTML='';state.sheet=null;state.sheetContext=null;state.returnToGuide=false;setProductInert(false);if(restoreFocus&&focusBeforeSheet?.isConnected)focusBeforeSheet.focus({preventScroll:true});}
    function exportCSV(){const rows=ledgerRows(),lines=[['日期','商户','分类','支出金额（元）','模拟来源'],...rows.map(b=>[b.date,b.merchant,b.category,(b.cents/100).toFixed(2),b.channel])];const csv='\ufeff'+lines.map(line=>line.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='AI账单助手-模拟明细.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(`已导出 ${rows.length} 笔模拟账单`);}
    async function copyAnswer(turn){await copyPlain(responseText(turn));}


    /* ===== 交互与演示控制 ===== */
    document.addEventListener('click',event=>{
      const pageButton=event.target.closest('[data-page]');if(pageButton){setPage(pageButton.dataset.page);return;}
      const assetQuestion=event.target.closest('[data-asset-question]');if(assetQuestion){state.mode='auto';state.page='assistant';startQuestion(assetQuestion.dataset.assetQuestion);return;}
      const assetList=event.target.closest('[data-asset-list]');if(assetList){state.assetTab=assetList.dataset.assetList;render();return;}
      const billButton=event.target.closest('[data-bill]');if(billButton){const bill=BILLS.find(b=>b.id===billButton.dataset.bill);if(bill)openSheet('bill',{bill,note:false});return;}
      const noteButton=event.target.closest('[data-note]');if(noteButton){const bill=state.notes.find(n=>n.id===noteButton.dataset.note);if(bill)openSheet('bill',{bill,note:true});return;}
      const recovery=event.target.closest('[data-recovery-question]');if(recovery){state.mode='auto';startQuestion(recovery.dataset.recoveryQuestion);return;}
      const conversation=event.target.closest('[data-conversation]');if(conversation){restoreConversation(conversation.dataset.conversation,conversation.dataset.jumpTurn);return;}
      const historyFilter=event.target.closest('[data-history-filter]');if(historyFilter){state.historyFilter=historyFilter.dataset.historyFilter;sheetLayer.querySelector('.history-drawer').innerHTML=historyHTML();return;}
      const ledgerTab=event.target.closest('[data-ledger-tab]');if(ledgerTab){state.ledgerTab=ledgerTab.dataset.ledgerTab;sheetLayer.querySelector('.sheet-body').innerHTML=ledgerHTML();return;}
      const ledgerCategory=event.target.closest('[data-ledger-category]');if(ledgerCategory){state.ledgerTab='details';state.ledgerCategory=ledgerCategory.dataset.ledgerCategory;sheetLayer.querySelector('.sheet-body').innerHTML=ledgerHTML();return;}
      const remove=event.target.closest('[data-remove-attachment]');if(remove){const a=state.attachments.find(a=>a.id===remove.dataset.removeAttachment);if(a?.url)URL.revokeObjectURL(a.url);state.attachments=state.attachments.filter(a=>a.id!==remove.dataset.removeAttachment);renderDraftAttachments();updateComposer();return;}
      const preview=event.target.closest('[data-preview-attachment]');if(preview){const a=findAttachment(preview.dataset.previewAttachment);if(a)openSheet('preview',a);return;}
      const questionButton=event.target.closest('[data-question]');if(questionButton){startQuestion(questionButton.dataset.question);return;}
      const modeButton=event.target.closest('[data-mode]');if(modeButton){selectMode(modeButton.dataset.mode);return;}
      const filter=event.target.closest('[data-filter]');if(filter){const body=sheetLayer.querySelector('.sheet-body'),top=body.scrollTop;state.ledgerCategory=filter.dataset.filter;body.innerHTML=ledgerHTML();body.scrollTop=top;body.querySelector(`[data-filter="${state.ledgerCategory}"]`)?.focus({preventScroll:true});return;}
      const action=event.target.closest('[data-action]');if(!action)return;
      const turnEl=action.closest('[data-turn]'),index=turnEl?Number(turnEl.dataset.turn):state.turns.length-1,turn=state.turns[index];
      switch(action.dataset.action){
        case 'home':case 'new-chat':reset();toast('已开启新的账单对话');break;
        case 'membership-details':openSheet('membership');break;
        case 'membership-recharge':openSheet('recharge');break;
        case 'complete-recharge':if(turn){turn.membershipDismissed=true;refreshTurn(index);saveCurrent();}closeSheet();toast('充值演示完成，会员权益已续期');break;
        case 'dismiss-membership':turn.membershipDismissed=true;refreshTurn(index);saveCurrent();break;
        case 'history':openHistory();break;
        case 'asset-income':openSheet('income');break;
        case 'asset-yield':openSheet('yield');break;
        case 'add-note':state.mode='auto';startQuestion('帮我记一笔账');break;
        case 'asset-settings':openSheet('settings');break;
        case 'toggle-amounts':state.assetHideAmounts=!state.assetHideAmounts;if(state.sheet==='settings')openSheet('settings');render();break;
        case 'close-assistant':if(state.loading)cancelGeneration();saveCurrent();closeSheet(false);state.closed=true;document.getElementById('screen').classList.add('app-closed');document.getElementById('assistant-closed').hidden=false;break;
        case 'reopen':state.closed=false;state.page='assistant';document.getElementById('screen').classList.remove('app-closed');document.getElementById('assistant-closed').hidden=true;render();break;
        case 'reset':reset();showGuide();toast('已重置，可重新体验首次指引');break;
        case 'refresh-questions':state.questionSet=(state.questionSet+1)%suggestionSets.length;render();scrollEl.querySelector('[data-action="refresh-questions"]').focus({preventScroll:true});announce('已更换推荐问题');break;
        case 'source':openSheet('source');break;
        case 'guide-source':openSheet('source');state.returnToGuide=true;break;
        case 'guide-start':if(!document.getElementById('guide-agreement')?.checked){toast('请先勾选数据使用说明');break;}rememberGuide();closeSheet(false);showTour(0);break;
        case 'tour-next':showTour(1);break;
        case 'tour-done':closeSheet();updateDemoStatus();announce('已开始体验');break;
        case 'confirm-note':persistNote(turn);break;
        case 'stop-generation':cancelGeneration();break;
        case 'resync':state.mode='auto';startQuestion(turn.question,{replace:true});break;
        case 'skip-guide':rememberGuide();closeSheet();updateDemoStatus();break;
        case 'available-question':state.mode='auto';startQuestion(FULL_QUESTION,{replace:true});break;
        case 'attach':openSheet('attach');break;
        case 'more':openHistory();break;
        case 'choose-image':document.getElementById('image-input').click();break;
        case 'choose-file':document.getElementById('file-input').click();break;
        case 'voice-sample':closeSheet();input.value=FULL_QUESTION;resizeInput();updateComposer();input.focus({preventScroll:true});announce('示例语音已转成文字，可发送问题');break;
        case 'close-sheet':if(state.returnToGuide){state.returnToGuide=false;showGuide();}else{closeSheet();}break;
        case 'analysis':if(turn?.status==='busy')break;if(turn?.status==='network'){toast('连接失败，请检查网络设置',{center:true});break;}openSheet('analysis',turn);break;
        case 'analysis-details':{const context=state.sheetContext;openSheet('details',context.analysis);break;}
        case 'details':openSheet('details',turn.analysis);break;
        case 'all-bills':openSheet('details');break;
        case 'load-sample':openSheet('details');toast('68 笔示例账单已就绪，当前展示 10 月');break;
        case 'download':exportCSV();break;
        case 'retry':{
          // 保留旧轮次上下文，从选中的失败问题重试；网络演示首次失败后可恢复成功。
          if(state.loading){toast('正在生成，请稍候');break;}
          if(index!==state.turns.length-1){state.turns.push({...turn});}
          const recovery=['network','busy','cancelled'].includes(turn.status);if(recovery){state.mode='auto';}
          startQuestion(turn.question,{replace:true});break;
        }
        case 'edit':state.mode='auto';updateDemoStatus();input.value=turn.question;resizeInput();updateComposer();input.focus({preventScroll:true});input.setSelectionRange(0,input.value.length);toast('修改后发送，即可继续查询');break;
        case 'categories':turn.expanded=!turn.expanded;action.closest('.report-section').innerHTML=categoriesHTML(turn.analysis,turn.expanded);break;
        case 'copy':copyAnswer(turn);break;
        case 'vote-up':case 'vote-down':{const value=action.dataset.action==='vote-up'?'up':'down';turn.feedback=turn.feedback===value?null:value;refreshTurn(index);saveCurrent();announce('已更新本机反馈');break;}
        case 'bookmark':turn.saved=!turn.saved;refreshTurn(index);saveCurrent();toast(turn.saved?'已收藏，可在历史对话中查看':'已取消收藏');break;
        case 'share-answer':openSheet('share',turn);break;
        case 'copy-share':copyPlain(responseText(state.sheetContext));break;
        case 'helpful':turn.helpful=!turn.helpful;action.setAttribute('aria-pressed',String(turn.helpful));action.innerHTML=icon('thumbs-up')+(turn.helpful?'已反馈':'有帮助');toast(turn.helpful?'已记录反馈（仅本次演示）':'已取消反馈');break;
      }
    });
    function selectMode(mode){
      state.page='assistant';const question=state.turns.at(-1)?.question||FULL_QUESTION;
      if(state.loading)cancelGeneration();state.mode=mode;updateDemoStatus();
      if(mode==='auto'&&!state.turns.length){toast('将根据问题与可用账单判断结果');return;}
      // 强制成功对不受支持的问题不伪造答案：明确提示后用示例问题演示。
      let q=question;if(['success','membership','partial'].includes(mode)&&!analyze(q).valid){q=FULL_QUESTION;toast('该问题无可用数据，使用本月支出示例演示成功态');}
      startQuestion(q,{replace:Boolean(state.turns.length)});
    }
    document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();if(state.loading){openSheet('voice');return;}if(!input.value.trim()&&!state.attachments.length){openSheet('voice');return;}startQuestion(input.value);});
    input.addEventListener('input',()=>{resizeInput();updateComposer();});
    input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();startQuestion(input.value);}});
    sheetLayer.addEventListener('click',event=>{if(event.target===sheetLayer)closeSheet();});
    sheetLayer.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();closeSheet();}if(event.key==='Tab'){const list=Array.from(sheetLayer.querySelectorAll('button,a,input,textarea')).filter(el=>!el.disabled);if(!list.length)return;const first=list[0],last=list.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
    document.querySelector('.demo-options').addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const buttons=Array.from(document.querySelectorAll('[data-mode]')),current=buttons.indexOf(event.target.closest('[data-mode]'));let next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(current+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+buttons.length)%buttons.length;buttons[next].focus();selectMode(buttons[next].dataset.mode);});
    document.addEventListener('change',event=>{if(event.target.id==='guide-agreement'){document.getElementById('guide-start').setAttribute('aria-disabled',String(!event.target.checked));}});
    document.getElementById('image-input').addEventListener('change',event=>{addFiles(event.target.files);event.target.value='';});
    document.getElementById('file-input').addEventListener('change',event=>{addFiles(event.target.files);event.target.value='';});
    document.addEventListener('submit',event=>{if(event.target.id!=='note-form')return;event.preventDefault();const name=document.getElementById('note-name').value.trim(),amount=document.getElementById('note-amount').value,date=document.getElementById('note-date').value,category=document.getElementById('note-category').value;const cents=Math.round(Number(amount)*100);if(!name||!Number.isSafeInteger(cents)||cents<=0||!date)return;state.notes.push({id:newId(),name,cents,date,category});state.notes=state.notes.slice(-100);try{localStorage.setItem(NOTES_KEY,JSON.stringify(state.notes));}catch{}closeSheet(false);state.page='assets';state.assetTab='notes';render();toast('已保存到本机记账');});
    document.querySelector('.nav-page-tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const page=event.key==='Home'?'assets':event.key==='End'?'assistant':state.page==='assets'?'assistant':'assets';setPage(page);document.querySelector(`[data-page="${page}"]`).focus({preventScroll:true});});
    state.currentId=newId();state.history=loadHistory();state.notes=loadNotes();
    hydrateIcons();render();showGuide();
  </script>
</body>
</html>
